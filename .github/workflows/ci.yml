name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fieldnote/gateway lint
      - run: pnpm --filter @fieldnote/gateway format:check
      - run: pnpm --filter @fieldnote/gateway typecheck
      - run: pnpm --filter @fieldnote/gateway test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types match the schemas
        run: pnpm --filter @fieldnote/contracts check
      - run: pnpm --filter @fieldnote/contracts typecheck
      - run: pnpm --filter @fieldnote/contracts test
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Dart types parse the shared fixtures
        working-directory: packages/contracts/dart
        run: |
          dart pub get
          dart analyze
          dart test

  gateway-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the gateway the integration tests run
        run: pnpm --filter @fieldnote/gateway build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Client tests against the real gateway
        working-directory: packages/gateway_client
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test
          dart analyze
          dart test

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fieldnote/harness test

  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/mobile, apps/spike]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/evaluation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
